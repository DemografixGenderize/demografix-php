name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: Test and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify tag matches source version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          source_version="$(grep -oE "demografix-php/[0-9]+\.[0-9]+\.[0-9]+" src/Client.php | head -n1 | cut -d/ -f2)"
          echo "Tag version:    ${tag}"
          echo "Source version: ${source_version}"
          if [ "${tag}" != "${source_version}" ]; then
            echo "::error::Tag v${tag} does not match the version in src/Client.php (${source_version})."
            exit 1
          fi

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
